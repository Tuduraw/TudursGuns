plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Tudur's Vehicle Mod lands here after running its own `./gradlew publishToMavenLocal`.
	mavenLocal()
}

loom {
	// Same split as Tudur's Vehicle Mod: client-only rendering code stays out of the server jar.
	splitEnvironmentSourceSets()

	mods {
		"tudursguns" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// The base mod. Must be built from the SAME Minecraft/Yarn versions declared above, or the
	// class and method names this mod compiles against won't exist at runtime.
	modImplementation "com.example.tudursvehiclemod:tudursvehiclemod:${project.tudursvehiclemod_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
